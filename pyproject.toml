[tool.black]
line-length = 100
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "crystalgen",
]

[project]
name = "crystalgen"
version = "0.1.0"
requires-python = ">= 3.10"
description = "CrystalGen: diffusion-based generation of Li-ion cathode materials with polyhedral-connectivity guidance, differentiable redox losses, and physics-informed Li insertion."
readme = "README.md"
license = "MIT"
urls.repository = "https://github.com/SEN-Adarsh/crystalgentest"
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
"ase<=3.25.0",
"emmet-core>=0.84.2",  # keep up-to-date together with pymatgen
"huggingface-hub",
"hydra-core==1.3.1",
"numpy>=2",
"omegaconf==2.3.0",
"pandas",
"pymatgen>=2024.6.4",
"pytest",
"pytorch-lightning==2.0.6",
"requests",
"scipy",
# Unpinned on linux so pip resolves against the CUDA build already present
# (Colab ships one) rather than demanding a specific torch from
# download.pytorch.org. Deliberately no upper bound: capping it makes pip
# *downgrade* the host torch, which is a ~1.9 GB detour.
"torch>=2.2.1; sys_platform == 'linux'",
"torch==2.4.1; sys_platform == 'darwin'",
# These three are C++/CUDA extensions built against one exact torch version, and
# PyPI carries source only, so a bare `pip install` compiles each for 15-20
# minutes. Point pip at the matching prebuilt wheels instead - note the full
# local version, cu128 and all:
#   pip install -e . -f https://data.pyg.org/whl/torch-2.11.0+cu128.html
# substituting your own `python -c "import torch; print(torch.__version__)"`.
# colab_setup.sh does this for you. If data.pyg.org has no directory for your
# torch, downgrade torch to one it does rather than compiling.
"torch_cluster",
"torch_geometric>=2.5",
"torch_scatter",
"torch_sparse",
"tqdm",
]

[tool.setuptools.packages.find]
include = ["crystalgen*"]

[tool.setuptools.package-data]
"*" = ["**.yaml", "**.csv", "**.pt", "**.json"]

[build-system]
requires = ["setuptools <81"]
build-backend = "setuptools.build_meta"
