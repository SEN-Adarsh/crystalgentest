sampler_partial:
  _target_: crystalgen.diffusion.sampling.classifier_free_guidance.GuidedPredictorCorrector.from_pl_module
  N: 1000
  eps_t: ${eval:'1/${.N}'}

  _partial_: true
  guidance_scale: 0.0
  # Feature 3: polyhedral awareness. Steers the coordinate score towards open,
  # corner-sharing polyhedral networks during reverse diffusion. 0 disables it
  # and reproduces stock CrystalGen sampling exactly.
  polyhedral_guidance_weight: 0.0
  polyhedral_geometry_weight: 1.0
  polyhedral_connectivity_weight: 1.0
  # Run 3 ablation: false = full-strength guidance at every step (no (1-t) fade).
  polyhedral_annealing: true
  # Optional safety clamp: cap |w*grad| at this multiple of |score| (null = off).
  max_guidance_rel: null
  # If set, per-step guidance diagnostics are written here (numbered per batch).
  steer_trace_path: null
  remove_conditioning_fn:
    _target_: crystalgen.property_embeddings.SetUnconditionalEmbeddingType
  keep_conditioning_fn:
    _target_: crystalgen.property_embeddings.SetConditionalEmbeddingType
  predictor_partials:
    pos:
      _target_: crystalgen.diffusion.wrapped.wrapped_predictors_correctors.WrappedAncestralSamplingPredictor
      _partial_: true
    cell:
      _target_: crystalgen.common.diffusion.predictors_correctors.LatticeAncestralSamplingPredictor
      _partial_: true
    atomic_numbers:
      _target_: crystalgen.diffusion.d3pm.d3pm_predictors_correctors.D3PMAncestralSamplingPredictor
      predict_x0: True
      _partial_: true

  corrector_partials:
    pos:
      _target_: crystalgen.diffusion.wrapped.wrapped_predictors_correctors.WrappedLangevinCorrector
      _partial_: true
      max_step_size: 1e6
      snr: 0.4
    cell:
      _target_: crystalgen.common.diffusion.predictors_correctors.LatticeLangevinDiffCorrector
      _partial_: true
      max_step_size: 1e6
      snr: 0.2

  n_steps_corrector: 1

condition_loader_partial:
  _partial_: true
  _target_: crystalgen.common.data.condition_factory.get_number_of_atoms_condition_loader
